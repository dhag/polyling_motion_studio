<script>
(() => {
  /* ===== PolyLingMotion adapter（読込 v1〜v5、保存 v5。PolyLing_VRMA整備計画.md 2.2・PolyLing_モーション編集構造計画.md 段 1）=====
     v5 は平らなトラックに加えて編集の構造 edit（トラック・クリップ・バンドル・レイヤー）を書く。読込は edit があればそれから作り、
     edit の当たらない平らなトラックは v4 と同じくトラックごとにクリップ 1 本で作る。
     PolyLingの時刻は秒、編集UIはフレーム。
     bakedBones（正準骨格上の Humanoid ローカル回転。Hips の pos は「レスト位置からの差 ÷ レストの腰の高さ」）が骨の正本。
     骨の表示と VRMA の書き出しは bakedBones だけから作る（マッスルから骨を解けるのは PolyLing だけ）。
     腰（Humanoid の RootT / RootQ）は body トラック（id "body"、targetKind "body"、キーの pos / rot）、
     視線は lookAt トラック（id "lookAt"、targetKind "lookAt"、キーの rot）に入れる。どちらも骨としては扱わない（isAuxTrack）。
     v3 以前の bakedBones は元モデルのレスト（sourceRest）基準なので読まず、sourceRest も読まない（警告を出す）。
     muscles に RootT.* / RootQ.* があるファイル（v3 より前の書き方）は PolyLing 側と同じく読まない
     （PolyLing の convertMotionRootToBody で body トラックへ移してから読む）。
     保存の決まり：bakedBones は Hips 以外の pos と全部の scl を書かない。muscles があり、bakedBones を読込時から変えたときは
     muscles と body を書かない（食い違うため。PolyLing が読むときに bakedBones から焼き直す）。
     接線（tan / posTan / rotTan / sclTan）とラップモードは保持して書き戻す。
     キーの元の秒（t0）も保持し、キーが元のフレームにある間は t0 をそのまま書き出す。
     ただし、キーを持つクリップが 2 本以上か重み 1 未満のクリップがあるか、キーを持つクリップがレイヤー（layer を持つバンドル）に
     属するトラック（plNeedsBake）は、キーのままでは再生と
     一致しないので、再生の評価（Track.sample）をフレーム 0〜最終フレームで標本化して書く（接線・t0 なし、ラップ Clamp）。
     再生は接線とラップモードを使って評価する（plmotion_curve.js。規則の正本は MotionCurveMath.cs）。
     接線はグラフエディタ（値カーブ）とキーのインスペクタで編集し、キーの tan に書く。ここではそれをそのまま書き出す。 */
  const plClone=v=>v==null?v:JSON.parse(JSON.stringify(v));
  const plFinite=n=>Number.isFinite(+n);
  const plVec=(v,n)=>Array.isArray(v)&&v.length>=n&&v.slice(0,n).every(plFinite)?v.slice(0,n).map(Number):null;
  function plPut(c,ch,f,v,tan,t0){const a=c.keys[ch];if(!a)return;const ex=a.find(k=>k.f===f),val=Array.isArray(v)?v.slice():v;
    const k=ex||{f};k.v=val;if(tan!=null)k.tan=plClone(tan);else delete k.tan;if(plFinite(t0))k.t0=+t0;else delete k.t0;if(!ex)a.push(k);}
  function plTrackMaxTime(src){let m=0;(src&&Array.isArray(src.keys)?src.keys:[]).forEach(k=>{if(k&&plFinite(k.t))m=Math.max(m,+k.t);});return m;}
  function plHasTangents(data){let yes=false;
    const scan=t=>(t&&Array.isArray(t.keys)?t.keys:[]).forEach(k=>{if(k&&(k.tan||k.posTan||k.rotTan||k.sclTan))yes=true;});
    ['bones','bakedBones','expressions','muscles','morphs'].forEach(n=>(data[n]||[]).forEach(scan));scan(data.body);scan(data.lookAt);return yes;}
  function plAddTrack(dst,src,type,role,fps,len,clipName){if(!src||typeof src!=='object')return null;
    const id=String(src.id||src.name||role||'Track');
    const t=dst.addTrack({name:id,type,color:pickCol(),uname:(role==='bakedBones'&&src.targetKind==='humanoid')?id:null,
      plRole:role,plTargetKind:src.targetKind||null,preWrapMode:src.preWrapMode||null,postWrapMode:src.postWrapMode||null,
      plCategory:src.category||null,plProvider:src.provider||null});
    const c=t.addClip({name:clipName||'PolyLing',start:0,len});
    (Array.isArray(src.keys)?src.keys:[]).forEach(k=>{if(!k||!plFinite(k.t))return;const f=Math.max(0,Math.round(+k.t*fps));
      if(type==='bone'){
        const q=plVec(k.rot,4),p=plVec(k.pos,3),s=plVec(k.scl,3);
        if(q)plPut(c,'rot',f,Q.norm(q),Array.isArray(k.rotTan)?k.rotTan:null,k.t);
        if(p)plPut(c,'pos',f,p,Array.isArray(k.posTan)?k.posTan:null,k.t);
        if(s)plPut(c,'scl',f,s,Array.isArray(k.sclTan)?k.sclTan:null,k.t);
      }else if(plFinite(k.v))plPut(c,'w',f,+k.v,k.tan&&typeof k.tan==='object'?k.tan:null,k.t);
    });c._sort();return t;}
  /* ---- 編集の構造 edit（version 5。PolyLing_外部連携の契約.md §5）----
     edit.tracks のトラックは (role, targetKind, target) で平らなトラックに当たる。edit.bundles はバンドルとレイヤー。
     時刻はフレーム。表示だけの欄（色・展開・表示の種類・グループ・畳み）は書かない。 */
  const PL_ROLE_TYPE={bones:'bone',bakedBones:'bone',body:'bone',lookAt:'bone',expressions:'morph',muscles:'muscle'};
  const plFlatKey=(role,kind,target)=>role+'\n'+(kind||'')+'\n'+target;
  function plAddEditTrack(dst,et){const type=PL_ROLE_TYPE[et.role];if(!type)throw new Error(`edit のトラック ${et.id} の role "${et.role}" は読めません`);
    const t=dst.addTrack({id:String(et.id),name:String(et.name!=null?et.name:et.target),type,color:pickCol(),uname:et.uname||null,
      plRole:et.role,plTargetKind:et.targetKind||null,preWrapMode:et.preWrapMode||null,postWrapMode:et.postWrapMode||null,
      plCategory:et.category||null,plProvider:et.provider||null});
    (Array.isArray(et.clips)?et.clips:[]).forEach(c=>{const keys={};
      t.channels.forEach(ch=>{const a=c[ch.name];if(Array.isArray(a))keys[ch.name]=a.map(k=>{
        const y={f:+k.f,v:Array.isArray(k.v)?k.v.map(Number):+k.v};if(k.tan!=null)y.tan=k.tan;if(plFinite(k.t0))y.t0=+k.t0;return y;});});
      t.addClip({id:String(c.id),name:c.name,start:+c.start||0,len:+c.len,loop:!!c.loop,weight:c.weight==null?1:+c.weight,keys});});
    return t;}
  function importPolyLing(data,fileName,label){
    if(!data||data.format!=='PolyLingMotion')throw new Error('format が PolyLingMotion ではありません');
    const ver=+data.version||1;if(![1,2,3,4,5].includes(ver))throw new Error('未対応のversion: '+data.version);
    const oldRoot=(Array.isArray(data.muscles)?data.muscles:[]).find(t=>t&&/^Root[TQ]\./.test(String(t.name||'')));
    if(oldRoot)throw new Error(`muscles に ${oldRoot.name} があります（腰は body トラックに入れる形式に変わりました。PolyLing の convertMotionRootToBody で変換してください）`);
    if(data.body&&(String(data.body.id||'')!=='body'||data.body.targetKind!=='body'))
      throw new Error('body トラックの id と targetKind は "body" でなければなりません');
    const notes=[];
    let baked=Array.isArray(data.bakedBones)?data.bakedBones:[];
    if(ver<4&&baked.length){notes.push(`v${ver} の bakedBones ${baked.length} 本は元モデルのレスト基準なので読みません`);baked=[];}
    if(Array.isArray(data.sourceRest)&&data.sourceRest.length)notes.push('sourceRest は使わないので読みません');
    const look=ver>=4&&data.lookAt&&typeof data.lookAt==='object'?data.lookAt:null;
    const fps=plFinite(data.frameRate)&&+data.frameRate>0?+data.frameRate:30;
    const expressions=Array.isArray(data.expressions)?data.expressions:(ver===1&&Array.isArray(data.morphs)?data.morphs:[]);
    const arrays=[data.bones,baked,expressions,data.muscles].filter(Array.isArray);let maxT=plFinite(data.duration)?Math.max(0,+data.duration):0;
    arrays.forEach(a=>a.forEach(t=>maxT=Math.max(maxT,plTrackMaxTime(t))));maxT=Math.max(maxT,plTrackMaxTime(data.body),plTrackMaxTime(look));
    // 秒→フレームの切り上げは float の誤差（34.0000032 など）で 1 フレーム伸びないよう、わずかな余裕を引く
    const len=Math.max(1,Math.ceil(maxT*fps-1e-4)+1),nm=String(data.name||fileName||'PolyLingMotion');
    const ofs=plVec(data.lookAtOffsetFromHeadBone,3);
    const dst=new MotionTimeline({fps,plMotion:{format:'PolyLingMotion',version:5,name:nm,space:data.space||'local',loop:!!data.loop,
      duration:maxT,metadata:plClone(data.metadata||null),
      absentMuscles:data.absentMuscles==='zero'||data.absentMuscles==='rest'?data.absentMuscles:null,
      lookAtOffsetFromHeadBone:ofs}});
    // version 5 の edit があれば、そのトラック（edit の順）とバンドルを作る。edit の当たらない平らなトラックはクリップ 1 本で後ろに足す
    const edit=data.edit&&typeof data.edit==='object'?data.edit:null;
    if(edit&&ver<5){notes.push(`v${ver} の edit は読みません`);}
    // rotationSource が bakedBones のとき、muscles と body は bakedBones から作った派生（PolyLing の MotionClipDTO.BakedBonesArePrimary）。
    // 本体と同じく派生のトラックは読まない（MotionEditOps.EnsureEdit は edit に足さない）。書き戻すと rotationSource の無いファイルで
    // muscles が正本になり、本体が bakedBones を派生として扱う。保存は bakedBones だけになり、本体が読むときに作り直す。
    const derivedMB=data.rotationSource==='bakedBones'&&baked.length>0;
    if(derivedMB&&((Array.isArray(data.muscles)&&data.muscles.length)||data.body))notes.push('muscles と body は bakedBones から作った派生なので読みません（PolyLing が読むときに作り直します）');
    const isDerivedRole=role=>derivedMB&&(role==='muscles'||role==='body');
    const covered=new Set(),droppedClips=new Set();
    if(edit&&ver>=5){(Array.isArray(edit.tracks)?edit.tracks:[]).forEach(et=>{if(!et)return;
        if(isDerivedRole(et.role)){(Array.isArray(et.clips)?et.clips:[]).forEach(c=>{if(c)droppedClips.add(String(c.id));});return;}
        plAddEditTrack(dst,et);covered.add(plFlatKey(et.role,et.targetKind,et.target));});
      (Array.isArray(edit.bundles)?edit.bundles:[]).forEach(b=>{if(!b)return;dst.addBundle({id:String(b.id),name:b.name,color:PAL[(dst.bundles.length+2)%PAL.length],
        clipIds:Array.isArray(b.clipIds)?b.clipIds.map(String).filter(id=>!droppedClips.has(id)):[],childIds:Array.isArray(b.childIds)?b.childIds.map(String):[],
        parentId:b.parentId!=null?String(b.parentId):null,layer:b.layer||null});});
      bumpUid(dst);}   // 後で足すトラック・クリップの id が edit の id と重ならないように
    const flat=(x,role,kind,target)=>!covered.has(plFlatKey(role,kind,target));
    (Array.isArray(data.bones)?data.bones:[]).forEach(x=>{if(x&&flat(x,'bones',x.targetKind||'path',x.id))plAddTrack(dst,x,'bone','bones',fps,len,nm);});
    if(data.body&&!derivedMB&&flat(data.body,'body','body','body'))plAddTrack(dst,data.body,'bone','body',fps,len,nm);
    if(look&&flat(look,'lookAt','lookAt','lookAt'))plAddTrack(dst,Object.assign({},look,{id:'lookAt',targetKind:'lookAt'}),'bone','lookAt',fps,len,nm);
    baked.forEach(x=>{if(x&&flat(x,'bakedBones','humanoid',x.id))plAddTrack(dst,x,'bone','bakedBones',fps,len,nm);});
    expressions.forEach(x=>{if(x&&(x.path||flat(x,'expressions',null,x.name)))plAddTrack(dst,x,'morph','expressions',fps,len,nm);});
    if(!derivedMB)(Array.isArray(data.muscles)?data.muscles:[]).forEach(x=>{if(x&&flat(x,'muscles',null,x.name))plAddTrack(dst,x,'muscle','muscles',fps,len,nm);});
    bumpUid(dst);
    tl=dst;window.tl=tl;motionSpace=data.space||'local';_retargetBackup=null;_poseResetNext=true;_warnedNoBaked=false;
    tl.plMotion.bakedSig=plBakedSig();   // 保存時に「bakedBones を変えたか」を見るための控え
    sel=null;marked=[];keySel=[];activeSet=new Set();lastTrack=null;playhead=0;scrollY=0;view.start=0;refresh();notifyFrame();emitState();sendPose();
    const n=tl.tracks.length,tan=plHasTangents(data);
    window.tlUndo.clearHistory();   // ファイル読込。履歴を消す
    toast(`${label||'PolyLing v'+ver} 読込: ${n}トラック / ${fps}fps${tan?'（接線あり）':''}${notes.length?' / '+notes.join(' / '):''}`);return n;
  }
  function plKeyMap(t,fps){const map=new Map();
    [...t.clips].sort((a,b)=>a.start-b.start).forEach(c=>t.channels.forEach(ch=>(c.keys[ch.name]||[]).forEach(k=>{
      const f=Math.max(0,Math.round(c.start+k.f));let o=map.get(f);if(!o){o={f};map.set(f,o);}
      if(plFinite(k.t0)&&Math.round(+k.t0*fps)===f&&o.t0==null)o.t0=+k.t0;   // 動かしていないキーは元の秒を使う
      const tan=k.tan!=null?plClone(k.tan):null;
      if(ch.name==='rot'){const q=plVec(k.v,4);if(q){o.rot=Q.norm(q);if(Array.isArray(tan))o.rotTan=tan;}}
      else if(ch.name==='pos'){const v=plVec(k.v,3);if(v){o.pos=v;if(Array.isArray(tan))o.posTan=tan;}}
      else if(ch.name==='scl'){const v=plVec(k.v,3);if(v){o.scl=v;if(Array.isArray(tan))o.sclTan=tan;}}
      else if(ch.name==='w'&&plFinite(k.v)){o.v=+k.v;if(tan&&!Array.isArray(tan)&&typeof tan==='object')o.tan=tan;}
    })));return [...map.values()].sort((a,b)=>a.f-b.f);}
  const plNegTan=tn=>{if(!tn||typeof tn!=='object')return tn;const o=Object.assign({},tn);
    if(plFinite(o.inTangent))o.inTangent=-o.inTangent;if(plFinite(o.outTangent))o.outTangent=-o.outTangent;return o;};
  // 保存の最終フレーム（全クリップの末尾のうち最大）
  function plMaxFrame(){let m=0;tl.tracks.forEach(t=>t.clips.forEach(c=>m=Math.max(m,c.start+Math.max(0,c.len-1))));return m;}
  // キーをそのまま書くと再生（Track.sample）と一致しないトラックか。
  // キーを持つクリップが 2 本以上（再生はクリップごとのキーで評価し、保存は全クリップのキーを 1 列にするため、
  // 前後キーで傾きを求める Auto 等の接線とループの周期が変わる）、または重み 1 未満のクリップがある（再生は評価後に重みを掛ける）。
  // 1 クリップ・重み 1 なら、ループでも再生（Clip.sampleChannel）と保存は同じキー列・同じラップで評価されるので一致する。
  // キーを持つクリップがレイヤー（layer を持つバンドルとその下）に属するトラックも、再生はレイヤーを合成するので標本化する。
  function plNeedsBake(t){const cs=t.clips.filter(c=>t.channels.some(ch=>(c.keys[ch.name]||[]).length));
    const info=layerInfo(tl);
    return cs.length>=2||cs.some(c=>c.weight<1)||!!(info&&cs.some(c=>info.clipLayer.get(c.id)));}
  // 再生の評価をフレーム 0〜maxF で標本化したキー（接線・t0 なし、時刻は f/fps）。キーのあるチャンネルだけ書く
  function plBakeKeys(t,fps,maxF){const has=new Set(t.channels.filter(ch=>t.clips.some(c=>(c.keys[ch.name]||[]).length)).map(ch=>ch.name)),keys=[];
    for(let f=0;f<=maxF;f++){const s=t.sample(f),k={t:+(f/fps).toFixed(7)};
      if(has.has('pos')){const v=plVec(s.pos,3);if(v)k.pos=v;}
      if(has.has('rot')){const q=plVec(s.rot,4);if(q)k.rot=Q.norm(q);}
      if(has.has('scl')){const v=plVec(s.scl,3);if(v)k.scl=v;}
      if(has.has('w')&&plFinite(s.w))k.v=+s.w;
      keys.push(k);}
    return keys;}
  function plMakeTrack(t,fps,targetKind,maxF){const bake=plNeedsBake(t);
    const keys=bake?plBakeKeys(t,fps,maxF==null?plMaxFrame():maxF):plKeyMap(t,fps).map(r=>{const k={t:r.t0!=null?r.t0:+(r.f/fps).toFixed(7)};
      if(r.pos)k.pos=r.pos;if(r.rot)k.rot=r.rot;if(r.scl)k.scl=r.scl;if(plFinite(r.v))k.v=r.v;
      if(r.posTan)k.posTan=r.posTan;if(r.rotTan)k.rotTan=r.rotTan;if(r.sclTan)k.sclTan=r.sclTan;if(r.tan)k.tan=r.tan;return k;});
    // 回転の半球をそろえる。符号を反転したキーは rotTan の傾きも反転する（重みとモードはそのまま）
    let prev=null;keys.forEach(k=>{if(!k.rot)return;if(prev&&prev[0]*k.rot[0]+prev[1]*k.rot[1]+prev[2]*k.rot[2]+prev[3]*k.rot[3]<0){
      k.rot=k.rot.map(v=>-v);if(Array.isArray(k.rotTan))k.rotTan=k.rotTan.map(plNegTan);}prev=k.rot;});
    // 再生の評価（Clip.sampleChannel・Track.sampleContinuous）と同じ値。標本化したトラックは全フレームにキーがあるので Clamp
    const wrap=bake?{pre:'Clamp',post:'Clamp'}:trackWrap(t);
    return{id:String((targetKind==='humanoid'&&t.uname)||t.name||t.id),targetKind,
      preWrapMode:wrap.pre,postWrapMode:wrap.post,keys};}
  // bakedBones（ボーン型で骨のトラック）の中身の控え。読込時と保存時で比べる。
  // 保存と同じ plMakeTrack で作るので、重みやクリップだけ変えたトラックも標本化した値の差として現れる
  function plBakedSig(){const fps=plFinite(tl.fps)&&+tl.fps>0?+tl.fps:30,maxF=plMaxFrame();
    return JSON.stringify(tl.tracks.filter(t=>t.type==='bone'&&!isAuxTrack(t)&&(t.plRole==='bakedBones'||(!t.plRole&&t.uname)))
      .map(t=>plMakeTrack(t,fps,'humanoid',maxF)).sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0));}
  let plLastDropped=false;   // 直前の exportPolyLing で muscles と body を書かなかったか
  // edit のトラック（平らなトラック d を書いた Studio のトラック t。表示だけの欄と null の欄は書かない）
  function plEditTrack(t,role,kind,target){const o={id:String(t.id),role};if(kind)o.targetKind=kind;o.target=String(target);
    o.name=String(t.name!=null?t.name:target);if(t.uname)o.uname=String(t.uname);
    if(t.plCategory)o.category=t.plCategory;if(t.plProvider)o.provider=t.plProvider;
    if(t.preWrapMode)o.preWrapMode=t.preWrapMode;if(t.postWrapMode)o.postWrapMode=t.postWrapMode;
    o.clips=t.clips.map(c=>{const oc={id:String(c.id),name:c.name,start:c.start,len:c.len,loop:!!c.loop,weight:c.weight};
      t.channels.forEach(ch=>{const a=c.keys[ch.name]||[];if(!a.length)return;oc[ch.name]=a.map(k=>{
        const y={f:k.f,v:Array.isArray(k.v)?k.v.slice():k.v};if(k.tan!=null)y.tan=plClone(k.tan);if(plFinite(k.t0))y.t0=+k.t0;return y;});});
      return oc;});
    return o;}
  function exportPolyLing(){const meta=tl.plMotion||{},fps=plFinite(tl.fps)&&+tl.fps>0?+tl.fps:30;
    const out={format:'PolyLingMotion',version:5,name:String(meta.name||'Motion'),frameRate:fps,duration:0,
      space:meta.space||'local',loop:!!meta.loop,bones:[],expressions:[],muscles:[],body:null,bakedBones:[],
      metadata:plClone(meta.metadata||{createdWith:'Motion Studio'})};
    if(meta.absentMuscles==='zero'||meta.absentMuscles==='rest')out.absentMuscles=meta.absentMuscles;
    const maxF=plMaxFrame(),et=[];   // et: edit のトラック（平らなトラックを書いたものだけ）
    tl.tracks.forEach(t=>{let role=t.plRole;if(!role)role=t.type==='morph'?'expressions':t.type==='muscle'?'muscles':t.uname?'bakedBones':'bones';
      if(t.type==='morph'||role==='expressions'){const d=plMakeTrack(t,fps,'scalar',maxF);delete d.id;delete d.targetKind;d.name=String(t.name||t.id);
        if(t.plCategory)d.category=t.plCategory;if(t.plProvider)d.provider=t.plProvider;out.expressions.push(d);et.push(plEditTrack(t,'expressions',null,d.name));return;}
      if(t.type==='muscle'||role==='muscles'){const d=plMakeTrack(t,fps,'scalar',maxF);delete d.id;delete d.targetKind;d.name=String(t.name||t.id);out.muscles.push(d);
        et.push(plEditTrack(t,'muscles',null,d.name));return;}
      if(role==='body'){if(out.body)return;const d=plMakeTrack(t,fps,'body',maxF);d.id='body';out.body=d;et.push(plEditTrack(t,'body','body','body'));return;}   // 腰（RootT / RootQ）
      if(role==='lookAt'){if(out.lookAt)return;const d=plMakeTrack(t,fps,'lookAt',maxF);d.id='lookAt';   // 視線は回転だけ
        d.keys=d.keys.filter(k=>{delete k.pos;delete k.posTan;delete k.scl;delete k.sclTan;return !!k.rot;});out.lookAt=d;et.push(plEditTrack(t,'lookAt','lookAt','lookAt'));return;}
      const allowed=new Set(['boneName','path','humanoid']);let kind=t.plTargetKind||(role==='bakedBones'?'humanoid':'boneName');if(!allowed.has(kind))kind='boneName';
      if(role==='bones'&&kind==='humanoid')kind='boneName';const d=plMakeTrack(t,fps,kind,maxF);
      if(role==='bakedBones'||kind==='humanoid'){   // 正準骨格は骨の長さを持たないので、Hips の pos と回転だけ書く
        d.keys=d.keys.filter(k=>{delete k.scl;delete k.sclTan;if(d.id!=='Hips'){delete k.pos;delete k.posTan;}return !!(k.rot||k.pos);});
        if(d.keys.length){out.bakedBones.push(d);et.push(plEditTrack(t,'bakedBones','humanoid',d.id));}}
      else{out.bones.push(d);et.push(plEditTrack(t,'bones',kind,d.id));}
    });
    const ofs=plVec(meta.lookAtOffsetFromHeadBone,3);if(ofs)out.lookAtOffsetFromHeadBone=ofs;
    // muscles と bakedBones が食い違うときは muscles と body を書かない（PolyLing が bakedBones から焼き直す）
    plLastDropped=false;
    if((out.muscles.length||out.body)&&out.bakedBones.length&&meta.bakedSig!=null&&plBakedSig()!==meta.bakedSig){out.muscles=[];out.body=null;plLastDropped=true;}
    // edit：平らなトラックを書かなかったトラックは入れず、そのクリップはバンドルの clipIds から除く
    const tracks=et.filter(o=>!(plLastDropped&&(o.role==='muscles'||o.role==='body')));
    const clipSet=new Set();tracks.forEach(o=>o.clips.forEach(c=>clipSet.add(c.id)));
    out.edit={tracks,bundles:tl.bundles.map(b=>{const o={id:String(b.id),name:b.name,clipIds:b.clipIds.map(String).filter(id=>clipSet.has(id)),
      childIds:b.childIds.map(String)};if(b.parentId)o.parentId=String(b.parentId);if(b.layer)o.layer={...b.layer};return o;})};
    // 長さが読み込んだときのまま（フレームに直して同じ）なら、元の秒をそのまま書く
    const d0=meta.duration;out.duration=(plFinite(d0)&&Math.round(+d0*fps)===maxF)?+d0:+(maxF/fps).toFixed(7);return out;}
  function plSaveToast(data){toast(`PolyLing v5 保存: ${data.bones.length+data.bakedBones.length}ボーン / ${data.expressions.length}表情 / ${data.muscles.length}マッスル`
    +(plLastDropped?'（bakedBones を変えたのでマッスルと body は書かず。PolyLing が読むときに bakedBones から作り直します）':''));}
  function downloadPolyLing(){const data=exportPolyLing(),safe=(data.name||'motion').replace(/[\\/:*?"<>|]+/g,'_');
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=safe+'.plmotion.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    plSaveToast(data);}
  const plLoadBtn=document.getElementById('plLoadBtn'),plFile=document.getElementById('plFile'),plSaveBtn=document.getElementById('plSaveBtn');
  if(plLoadBtn)plLoadBtn.onclick=()=>plFile.click();if(plSaveBtn)plSaveBtn.onclick=downloadPolyLing;
  if(plFile)plFile.onchange=function(){const f=this.files&&this.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{
      importPolyLing(JSON.parse(rd.result),f.name.replace(/\.plmotion\.json$|\.json$/i,''));}catch(e){alert('PolyLing読込エラー: '+e.message);}};
    rd.readAsText(f);this.value='';};
  window.MotionStudioPolyLing={import:importPolyLing,export:exportPolyLing,download:downloadPolyLing};
  /* ===== VRMA (VRMC_vrm_animation 1.0) 読み書き =====
     外側の「VRMA読込」「VRMA保存」から使う（command 'vrmaLoadData' / 'vrmaSave'）。
     変換は plmotion_vrma.js（PLVrma。規則の正本は PolyLing の VrmaCodec）。
     読込：.vrma → bakedBones・表情・lookAt の PolyLing モーション（v4）→ importPolyLing。
     保存：exportPolyLing の結果 → .vrma。骨は bakedBones だけから作る（無ければ書き出せない）。 */
  function importVrma(buf,fileName){
    const r=window.PLVrma.decode(buf,fileName);
    const errs=r.issues.filter(i=>i.error),warns=r.issues.filter(i=>!i.error);
    if(!r.dto)throw new Error(errs.map(i=>i.message).join(' / ')||'読めません');
    const n=importPolyLing(r.dto,fileName,'VRMA');
    if(warns.length)toast(`VRMA 読込: ${n}トラック / 警告 ${warns.length} 件：${warns.map(i=>i.message).join(' / ')}`);
    return n;}
  function exportVrma(){const fps=plFinite(tl.fps)&&+tl.fps>0?+tl.fps:30;return window.PLVrma.encode(exportPolyLing(),{fps});}
  // 保存は外側が行う（このファイルは別ファイルとして読み込まれ、ここからは保存ダイアログを開けないため）。
  function sendVrmaFile(){let r;try{r=exportVrma();}catch(e){alert('VRMA保存エラー: '+e.message);return;}
    const buf=r.glb.buffer.slice(r.glb.byteOffset,r.glb.byteOffset+r.glb.byteLength);
    parent.postMessage({app:'MotionStudio',from:'timeline',file:{name:r.name.replace(/[\\/:*?"<>|]+/g,'_')+'.vrma',buffer:buf,mime:'model/gltf-binary'}},'*',[buf]);
    toast('VRMA 保存: '+window.PLVrma.reportText(r.report));}
  window.MotionStudioVrma={import:importVrma,export:exportVrma};
  const nativeSend = wsSend;
  wsSend = function(payload){
    nativeSend(payload);
    parent.postMessage({app:'MotionStudio',from:'timeline',payload}, '*');
  };
  // 軌跡（pathData / pathTarget）は外側へだけ送る（外側がボーン編集へ中継する）
  if(window.parent!==window) pathSink = payload => parent.postMessage({app:'MotionStudio',from:'timeline',payload}, '*');
  function state(){
    return {frame:Math.round(playhead),playing,selection:selectionSummary(),bones:selectedBoneIds(),canUndo:window.tlUndo.canUndo,canRedo:window.tlUndo.canRedo};
  }
  function report(){ parent.postMessage({app:'MotionStudio',from:'timeline',state:state()}, '*'); }
  window.tlUndo.onChanged=report;                                   // 履歴が変わったら外側の ↶ ↷ を更新
  bus.on('frameChange', report);
  bus.on('selectionChange', report);
  bus.on('boneChange', report);
  bus.on('dataChange', report);
  bus.on('keyEdit', report);
  window.addEventListener('message', ev => {
    const m=ev.data;
    if(!m || m.app!=='MotionStudio' || m.to!=='timeline') return;
    if(m.payload){ onWsMessage(m.payload); report(); return; }
    switch(m.command){
      case 'frame': window.tlSync.setFrame(+m.value||0); sendPose(); report(); break;
      case 'step': window.tlSync.setFrame(Math.max(0,Math.round(playhead)+(+m.value||0))); sendPose(); report(); break;
      case 'play': document.getElementById('play').click(); report(); break;
      case 'key': punchKeys(); sendPose(); report(); break;
      case 'delete': window.dispatchEvent(new KeyboardEvent('keydown',{key:'Delete',bubbles:true})); report(); break;
      case 'fit': document.getElementById('zFit').click(); report(); break;
      // ファイルの読み書きは外側が行う。ファイル選択と保存は、利用者が操作した画面でしか開けないため
      // （このファイルは別ファイルとして読み込まれ、外側のボタン操作はこちらへ伝わらない）。
      case 'plLoadText': try{importPolyLing(JSON.parse(m.text),String(m.name||'motion').replace(/\.plmotion\.json$|\.json$/i,''));}
                         catch(e){alert('PolyLing読込エラー: '+e.message);} report(); break;
      case 'vrmaLoadData': try{importVrma(m.buffer,String(m.name||'VRMA').replace(/\.vrma$/i,''));}catch(e){alert('VRMA読込エラー: '+e.message);} report(); break;
      case 'vrmaSave': sendVrmaFile(); break;
      case 'plSave': {const data=exportPolyLing(),safe=(data.name||'motion').replace(/[\\/:*?"<>|]+/g,'_');
                      parent.postMessage({app:'MotionStudio',from:'timeline',file:{name:safe+'.plmotion.json',text:JSON.stringify(data,null,2)}},'*');
                      plSaveToast(data);} break;
      case 'undo': window.tlUndo.undo(); break;
      case 'redo': window.tlUndo.redo(); break;
    }
  });
  requestAnimationFrame(() => {
    parent.postMessage({app:'MotionStudio',from:'timeline',ready:true,state:state()}, '*');
    notifyFrame(); emitState(); sendPose();
  });
})();
